{% extends "base.html" %}
{% block title %}Reset password | SwiftInvoice{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Reset your password</h1>
  <p class="auth-alt">Enter your account email and we will send you a reset link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-block">Send reset link</button>
  </form>
  <p class="auth-alt"><a href="{% url 'login' %}">Back to log in</a></p>
</div>
{% endblock %}
