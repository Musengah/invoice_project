{% extends "base.html" %}
{% block title %}Sign up | SwiftInvoice{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-block">Sign up</button>
  </form>
  <p class="auth-alt">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
